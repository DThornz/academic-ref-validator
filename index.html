<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reference Validator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <header>
      <h1>Reference Validator</h1>
      <p class="subtitle">Verify citations against CrossRef, Europe PMC, Semantic Scholar, arXiv, and more</p>
    </header>

    <main>
      <section class="input-panel">
        <textarea
          id="inputText"
          placeholder="Paste your bibliography or reference list here..."
          aria-label="Reference input"
        ></textarea>

        <div class="controls">
          <button id="analyzeBtn" class="primary">Analyze References</button>
          <button id="cancelBtn" class="secondary" hidden>Cancel</button>
          <button id="clearBtn" class="secondary">Clear</button>
          <button id="exportBtn" class="secondary" disabled>Export CSV</button>
          <button id="exportPdfBtn" class="secondary" disabled>Export PDF</button>
        </div>
        <p class="kbd-hint">Ctrl+Enter to analyze &nbsp;·&nbsp; Esc to clear</p>
        <div id="progressBar" class="progress-bar" hidden>
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </section>

      <section class="options-panel">
        <label class="option">
          <input type="checkbox" id="useBooks" checked>
          Search Google Books &amp; Open Library for book-like citations (fallback)
        </label>
        <label class="option">
          <input type="checkbox" id="strictMode">
          Strict matching (require exact title match)
        </label>
        <label class="option">
          <input type="checkbox" id="fuzzyMode">
          Fuzzy title matching — tolerates OCR errors, diacritics, and minor typos (slower)
        </label>
      </section>

      <div id="status" class="status" aria-live="polite"></div>

      <section id="results" class="results-container"></section>
    </main>

    <footer>
      <p>All checks are probabilistic. Results should be interpreted with care.</p>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
